# tlp config for lenovo laptop
#
# see: /etc/tlp.conf

# --- BAT ---

# Battery charge level above which charging will stop.
# STOP_CHARGE_THRESH_BAT0=0
# NOTE: overheating event likely caused the Embedded Controller (EC) to
# re-index the hardware registry so now tlp doesn't do the battery charging
# threshold. 'sudo tlp-stat -b' prints BAT1, hence need to set it instead:
STOP_CHARGE_THRESH_BAT1=1

# Restore charge thresholds when AC is unplugged: 0=disable, 1=enable.
# Default: 0
RESTORE_THRESHOLDS_ON_BAT=1

# --- CPU ---

# Select a CPU scaling driver operation mode.
# Intel CPU with intel_pstate driver:
#   active, passive.
# Default: <none>
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active


# --- PROFILE ---

# Switch profile on every power source change, overriding manual picks:
#   0=disabled, 1=auto, 2=smart.
# Default: 2
TLP_AUTO_SWITCH=1

# Default mode to use on battery
TLP_PROFILE_BAT=SAV
TLP_PROFILE_AC=BAL
